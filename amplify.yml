version: 1
# Note: For Amplify Gen 2, backend deployment is done via CLI, not through amplify.yml
# Deploy backend using: npx @aws-amplify/backend-cli pipeline-deploy --branch <branch-name>
frontend:
  phases:
    preBuild:
      commands:
        - echo "Current directory and contents:"
        - pwd
        - ls -la
        - echo "Looking for my-training-admin directory:"
        - find . -name "my-training-admin" -type d 2>/dev/null || echo "Directory not found in current location"
        - echo "Copying amplify_outputs.json to React app..."
        - "if [ -f amplify_outputs.json ] && [ -d my-training-admin/src ]; then cp amplify_outputs.json my-training-admin/src/amplify_outputs.json && echo 'Copied successfully'; else echo 'Warning: Files not found - amplify_outputs.json or my-training-admin/src'; fi"
        - echo "Installing Node.js dependencies..."
        - "cd my-training-admin && npm ci"
    build:
      commands:
        - echo "Building React admin app..."
        - "cd my-training-admin && npm run build"
        - echo "Build completed. Verifying build output:"
        - "if [ -d my-training-admin/build ]; then ls -la my-training-admin/build/ | head -20; else echo 'Build directory not found'; exit 1; fi"
  artifacts:
    baseDirectory: my-training-admin/build
    files:
      - '**/*'
  customHeaders:
    - pattern: '**/*'
      headers:
        - key: 'X-Content-Type-Options'
          value: 'nosniff'
        - key: 'X-Frame-Options'
          value: 'DENY'
        - key: 'X-XSS-Protection'
          value: '1; mode=block'

