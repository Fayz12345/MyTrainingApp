version: 1

frontend:
  phases:
    preBuild:
      commands:
        - echo "=== PreBuild Phase ==="
        - pwd
        - ls -la

        - echo "Installing React dependencies..."
        - "cd my-training-admin && npm ci"

    build:
      commands:
        - echo "Building React app..."
        - "cd my-training-admin && npm run build"

  artifacts:
    baseDirectory: my-training-admin/build
    files:
      - '**/*'

  customHeaders:
    - pattern: '**/*'
      headers:
        - key: "X-Content-Type-Options"
          value: "nosniff"
        - key: "X-Frame-Options"
          value: "DENY"
        - key: "X-XSS-Protection"
          value: "1; mode=block"
