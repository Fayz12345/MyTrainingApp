version: 1
frontend:
  phases:
    preBuild:
      commands:
        - "echo \"Working dir before build: $PWD\""
        - "ls -la"
        - "APP_DIR=\".\"; if [ ! -f package.json ] || [ ! -d src ] || [ ! -d public ]; then APP_DIR=\"my-training-admin\"; if [ ! -d \"$APP_DIR\" ]; then APP_DIR=\"MyTrainingApp/my-training-admin\"; fi; fi; if [ ! -d \"$APP_DIR\" ]; then echo \"my-training-admin folder not found\"; ls -la; exit 1; fi; cd \"$APP_DIR\"; npm ci"
    build:
      commands:
        - "APP_DIR=\".\"; if [ ! -f package.json ] || [ ! -d src ] || [ ! -d public ]; then APP_DIR=\"my-training-admin\"; if [ ! -d \"$APP_DIR\" ]; then APP_DIR=\"MyTrainingApp/my-training-admin\"; fi; fi; if [ ! -d \"$APP_DIR\" ]; then echo \"my-training-admin folder not found\"; ls -la; exit 1; fi; cd \"$APP_DIR\"; npm run build; OUTPUT_DIR=\"$CODEBUILD_SRC_DIR/build\"; rm -rf \"$OUTPUT_DIR\"; mkdir -p \"$OUTPUT_DIR\"; cp -R build/. \"$OUTPUT_DIR\""
  artifacts:
    baseDirectory: build
    files:
      - "**/*"
  cache:
    paths:
      - my-training-admin/node_modules/**/*
