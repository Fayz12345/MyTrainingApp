version: 1
frontend:
  phases:
    preBuild:
      commands:
        - corepack enable
        - npm ci
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**

backend:
  phases:
    build:
      commands:
        - npx ampx generate
        - npx ampx deploy --branch dev --app-id d6c38s8spsb1t
