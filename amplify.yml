version: 1
frontend:
  phases:
    preBuild:
      commands:
        - cd my-training-admin
        - npm ci
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: my-training-admin/build
    files:
      - '**/*'
  cache:
    paths:
      - my-training-admin/node_modules/**/*
