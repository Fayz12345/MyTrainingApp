name: Amplify Backend Deploy

on:
  push:
    branches:
      - dev
      - develop

jobs:
  deploy-backend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      # Step 1: Setup Node
      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 20

      # Step 2: Install Amplify CLI globally
      - run: npm install -g @aws-amplify/backend-cli

      # Step 3: Install dependencies in React folder
      - name: Install React dependencies
        run: npm ci
        working-directory: ./my-training-admin

      # Step 4: Deploy Amplify backend
      - name: Deploy Amplify backend
        run: npx ampx pipeline-deploy --branch ${{ github.ref_name }} --app-id ${{ secrets.AMPLIFY_APP_ID }}
        working-directory: ./my-training-admin
