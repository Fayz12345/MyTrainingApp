name: Amplify Backend Deploy

on:
  push:
    branches:
      - dev
  workflow_dispatch: # Allow manual triggering

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Required for OIDC

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 1: Setup Node
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: amplify/package-lock.json

      # Step 2: Install root dependencies (if any)
      - name: Install root dependencies
        run: |
          if [ -f "package.json" ]; then
            npm ci || echo "No root dependencies to install"
          fi
        continue-on-error: true

      # Step 3: Install Amplify backend dependencies
      - name: Install Amplify backend dependencies
        run: |
          # Use npm install with legacy-peer-deps to handle peer dependency conflicts
          # This is more flexible than npm ci when lock file might be out of sync
          echo "📦 Installing dependencies..."
          npm install --legacy-peer-deps
          echo "✅ Dependencies installed successfully"
          
          # Verify aws-cdk-lib is installed (required by backend-cli)
          if [ ! -d "node_modules/aws-cdk-lib" ]; then
            echo "⚠️  aws-cdk-lib not found, installing explicitly..."
            npm install aws-cdk-lib@^2.230.0 --legacy-peer-deps
          fi
        working-directory: ./amplify

      # Step 4: Build TypeScript (if needed)
      - name: Build TypeScript
        run: npm run build
        working-directory: ./amplify
        continue-on-error: true

      # Step 5: Configure AWS credentials
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ca-central-1

      # Step 6: Verify AWS credentials
      - name: Verify AWS credentials
        run: |
          aws sts get-caller-identity
          echo "✅ AWS credentials verified"

      # Step 7: Deploy Amplify backend
      - name: Deploy Amplify backend
        timeout-minutes: 30
        run: |
          set -e
          
          # Verify we're in the correct directory
          if [ ! -f "package.json" ] || [ ! -d "node_modules" ]; then
            echo "❌ Error: Not in amplify directory"
            echo "Current directory: $(pwd)"
            echo "Directory contents:"
            ls -la
            exit 1
          fi
          
          echo "📁 Deployment directory: $(pwd)"
          echo "📁 Absolute path: $(realpath .)"
          echo ""
          echo "🚀 Starting Amplify backend deployment..."
          echo "Branch: ${{ github.ref_name }}"
          echo "App ID: d6c38s8spsb1t"
          echo ""
          
          # Use ampx from local node_modules to avoid path resolution issues
          # This ensures we use the installed version and avoid npx path problems
          npx ampx pipeline-deploy \
            --branch ${{ github.ref_name }} \
            --app-id d6c38s8spsb1t \
            --verbose
          
          echo "✅ Deployment completed successfully"
        working-directory: ./amplify
        env:
          CI: true
          AWS_REGION: ca-central-1
          AWS_DEFAULT_REGION: ca-central-1

      # Step 8: Verify deployment
      - name: Verify deployment
        run: |
          echo "🔍 Verifying deployment..."
          npx ampx generate outputs \
            --app-id d6c38s8spsb1t \
            --branch ${{ github.ref_name }} \
            --format json \
            --out-dir /tmp/amplify-outputs || echo "⚠️ Could not generate outputs (this is OK if deployment succeeded)"
        working-directory: ./amplify
        continue-on-error: true
