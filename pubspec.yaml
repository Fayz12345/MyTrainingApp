name: my_training_app
description: A Flutter training application with AWS Amplify backend
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # AWS Amplify
  amplify_flutter: ^2.0.0
  amplify_auth_cognito: ^2.0.0
  amplify_authenticator: ^2.0.0
  amplify_api: ^2.0.0
  amplify_storage_s3: ^2.0.0
  amplify_secure_storage: ^0.5.13
  
  # Video Player
  video_player: ^2.8.0
  chewie: ^1.7.0
  
  # UI
  cupertino_icons: ^1.0.6
  flutter_html: ^3.0.0
  
  # State Management
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5
  
  # Routing
  go_router: ^14.0.0
  
  # HTTP & Storage
  dio: ^5.7.0
  shared_preferences: ^2.2.2
  path_provider: ^2.1.1
  intl: ^0.20.2
  image_picker:
  
  # PDF Viewer
  syncfusion_flutter_pdfviewer: ^32.1.22
  open_filex: ^4.5.0
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
  
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  
  assets:
    # Configuration
    - assets/amplify_outputs.json
    
    # Common Images
    - assets/images/common/
    - assets/images/icons/
    - assets/images/logos/
    
    # Animations
    - assets/animations/
    
    # Constants
    - assets/constants/
  
